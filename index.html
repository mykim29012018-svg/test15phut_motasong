<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kiểm tra Bài 8: Mô tả sóng</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8ecf1;--paper:#fff;--ink:#17222e;--muted:#5a6a7b;--line:#d3dae3;--accent:#1f5f8b;--onacc:#fff;--pick:#e4eef7;--ok:#17703f;--okbg:#e2f3e9;--bad:#b3261e;--badbg:#fbe6e4;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e151d;--paper:#17212c;--ink:#e8eef5;--muted:#9aabbc;--line:#2b3947;--accent:#74b6e3;--onacc:#0a1520;--pick:#1a3347;--ok:#68d29a;--okbg:#12311f;--bad:#ff8f86;--badbg:#391816;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e151d;--paper:#17212c;--ink:#e8eef5;--muted:#9aabbc;--line:#2b3947;--accent:#74b6e3;--onacc:#0a1520;--pick:#1a3347;--ok:#68d29a;--okbg:#12311f;--bad:#ff8f86;--badbg:#391816;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Be Vietnam Pro",system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 14px 56px}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:24px 22px;margin-bottom:16px}
h1,h2,.qh{font-family:"Source Serif 4",Georgia,serif}
h1{font-size:1.65rem;line-height:1.2;margin:0 0 4px}
h2{font-size:1.2rem;margin:0 0 2px}
.sub{color:var(--muted);margin:0}
.hint{color:var(--muted);font-style:italic;margin:2px 0 6px;font-size:.93rem}
label.f{display:block;font-weight:600;margin-top:16px}
input[type=text]{font:inherit;width:100%;padding:10px 12px;margin-top:6px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
input[type=text]:focus-visible,button:focus-visible,.opt:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
button{font:inherit;font-weight:600;padding:11px 20px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--onacc);cursor:pointer;margin-top:20px}
button.alt{background:transparent;color:var(--accent)}
button:disabled{opacity:.45;cursor:default}
.err{color:var(--bad);margin:8px 0 0;min-height:1.4em}
.who{display:flex;flex-wrap:wrap;gap:4px 24px;margin:10px 0 0;color:var(--muted)}
.who b{color:var(--ink)}
.q{padding:18px 0 4px}
.qh{font-size:1.06rem;margin:0 0 4px}
.qn{font-weight:700;color:var(--accent);font-family:"Be Vietnam Pro",sans-serif}
.opt{display:flex;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;margin-top:8px;cursor:pointer}
.opt:has(input:checked){background:var(--pick);border-color:var(--accent)}
.opt .l{font-weight:700;min-width:1.3em}
.opt .t{flex:1}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.tag{font-size:.82rem;font-weight:600;white-space:nowrap}
.ok .tag{color:var(--ok)}.bad .tag{color:var(--bad)}
.locked .opt{cursor:default}
.opt input{accent-color:var(--accent);margin:3px 0 0}
figure{margin:10px 0 6px}
figure img{display:block;max-width:100%;height:auto;background:#fff;border-radius:6px;padding:6px;border:1px solid var(--line)}
.ans{display:flex;align-items:center;gap:10px;margin-top:8px}
.ans input{max-width:170px;margin:0}
.unit{color:var(--muted)}
.why{margin:8px 0 6px;padding:8px 12px;border-left:3px solid var(--line);font-size:.93rem;color:var(--muted)}
.why.ok{border-color:var(--ok)}.why.bad{border-color:var(--bad)}
.why b{color:var(--ink)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px}
.bar p{margin:20px 0 0;color:var(--muted)}
#pal{display:grid;gap:8px}
.pg{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pl{min-width:4.8rem;font-weight:600;font-size:.9rem;color:var(--muted)}
.pb{display:flex;flex-wrap:wrap;gap:6px}
.pn{margin:0;padding:0;width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-weight:600;font-size:.9rem}
.pn.done{background:var(--pick);border-color:var(--accent)}
.pn.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.pn.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.pn.cur{outline:2px solid var(--accent);outline-offset:2px}
.score{display:flex;align-items:baseline;gap:8px;margin:10px 0 4px}
.score .n{font-family:"Source Serif 4",Georgia,serif;font-size:3.6rem;font-weight:600;line-height:1;color:var(--accent)}
.score .d{font-size:1.3rem;color:var(--muted)}
table{border-collapse:collapse;width:100%;margin-top:10px}
th,td{text-align:left;padding:8px 6px;border-top:1px solid var(--line);font-size:.95rem}
th{font-weight:600}
td:last-child,th:last-child{text-align:right}
#timer{position:fixed;top:10px;right:10px;z-index:50;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:6px 16px;font-weight:700;font-size:1.15rem;font-variant-numeric:tabular-nums;color:var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.15)}
#timer.low{color:var(--bad);border-color:var(--bad)}
@media (max-width:520px){.sheet{padding:18px 14px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

{q:"Cường độ sóng tại một điểm là",o:["năng lượng sóng truyền qua một đơn vị diện tích vuông góc với phương truyền sóng trong một đơn vị thời gian.","năng lượng mà nguồn sóng phát ra trong một đơn vị thời gian, tính cho toàn bộ không gian xung quanh nguồn.","quãng đường mà sóng truyền được trong khoảng thời gian bằng đúng một chu kì dao động của nguồn sóng.","tốc độ dao động lớn nhất của một phần tử môi trường khi có sóng truyền qua phần tử đó trong môi trường."],a:0,e:"Cường độ sóng là năng lượng sóng truyền qua một đơn vị diện tích đặt vuông góc với phương truyền sóng trong một đơn vị thời gian."},
{q:"Phát biểu nào sau đây về quá trình truyền sóng cơ là <b>sai</b>?",o:["Là quá trình truyền các phần tử vật chất từ nguồn ra xa dần.","Là quá trình truyền dao động trong môi trường đàn hồi.","Là quá trình truyền năng lượng từ nguồn ra các điểm xung quanh.","Các phần tử môi trường chỉ dao động quanh vị trí cân bằng của chúng."],a:0,e:"Sóng cơ truyền dao động và năng lượng, không truyền các phần tử vật chất."},
{q:"Tốc độ truyền của một sóng cơ phụ thuộc vào",o:["bản chất môi trường truyền sóng.","biên độ dao động của nguồn sóng.","tần số dao động của nguồn sóng.","năng lượng mà sóng truyền đi."],a:0,e:"Tốc độ truyền sóng chỉ phụ thuộc vào bản chất của môi trường truyền sóng."},
{q:"Chu kì và tần số của sóng cơ",o:["bằng chu kì và tần số dao động của các phần tử môi trường khi sóng truyền qua.","phụ thuộc vào bản chất và mật độ của môi trường mà sóng truyền qua.","giảm dần theo khoảng cách khi sóng truyền ra xa nguồn phát sóng trong môi trường.","thay đổi khi sóng truyền từ môi trường này sang một môi trường khác."],a:0,e:"Chu kì và tần số của sóng bằng chu kì và tần số dao động của nguồn và của các phần tử môi trường; không đổi khi sóng truyền sang môi trường khác."},
{q:"Khi một sóng âm truyền từ không khí vào nước thì",o:["bước sóng tăng.","tần số tăng.","tần số giảm.","bước sóng giảm."],a:0,e:"Tần số không đổi, tốc độ <span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi></mrow><annotation encoding=\"application/x-tex\">v</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.4306em;\"></span><span class=\"mord mathnormal\" style=\"margin-right:0.03588em;\">v</span></span></span></span> tăng nên <span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>λ</mi><mo>=</mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mi>v</mi><mi>f</mi></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\lambda = \\dfrac{v}{f}</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.6944em;\"></span><span class=\"mord mathnormal\">λ</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:1.988em;vertical-align:-0.8804em;\"></span><span class=\"mord\"><span class=\"mopen nulldelimiter\"></span><span class=\"mfrac\"><span class=\"vlist-t vlist-t2\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:1.1076em;\"><span style=\"top:-2.314em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"mord\"><span class=\"mord mathnormal\" style=\"margin-right:0.10764em;\">f</span></span></span><span style=\"top:-3.23em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"frac-line\" style=\"border-bottom-width:0.04em;\"></span></span><span style=\"top:-3.677em;\"><span class=\"pstrut\" style=\"height:3em;\"></span 3em;margin-right:0.05em;\"><span class=\"pstrut\" style=\"height:2.7em;\"></span><span class=\"sizing reset-size6 size3 mtight\"><span class=\"mord mtight\"><span class=\"mord mtight\">′</span></span></span></span></span></span></span></span></span></span></span></span><span class=\"vlist-s\">​</span></span><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.8804em;\"><span></span></span></span></span></span><span class=\"mclose nulldelimiter\"></span></span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:2.0074em;vertical-align:-0.686em;\"></span><span class=\"mord\"><span class=\"mopen nulldelimiter\"></span><span class=\"mfrac\"><span class=\"vlist-t vlist-t2\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:1.3214em;\"><span style=\"top:-2.314em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"mord\"><span class=\"mord\">680</span></span></span><span style=\"top:-3.23em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"frac-line\" style=\"border-bottom-width:0.04em;\"></span></span><span style=\"top:-3.677em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"mord\"><span class=\"mord\">1500</span></span></span></span><span class=\"vlist-s\">​</span></span><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.686em;\"><span></span></span></span></span></span><span class=\"mclose nulldelimiter\"></span></span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">≈</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.8389em;vertical-align:-0.1944em;\"></span><span class=\"mord\">2</span><span class=\"mord\"><span class=\"mpunct\">,</span></span><span class=\"mord\">21</span><span class=\"mspace\"> </span><span class=\"mord mathrm\">m</span></span></span></span>."}
];
const N1=P1.length,N2=P2.length,TOTAL=N1+N2;
const $=s=>document.querySelector(s);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=n=>(Math.round(n*100)/100).toLocaleString("vi-VN",{maximumFractionDigits:2});
let S,who={},warned=false,locked=false,cur=0,QS=[],R=[];
const SCORE_ENDPOINT = "https://script.google.com/macros/s/AKfycby0abrZLIUYTHKL64PcV3se7bgMof9By6pOUb1W9BTDMhbM_7kYiSSyM1Df6IxZP_I/exec";

// Gửi kết quả đến Google Sheets qua Apps Script.
function sendScore(score, total, details){
  const payload = {
    name: who.name || "",
    cls: who.cls || "",
    quiz: "Kiểm tra Bài 8: Mô tả sóng",
    score: score,
    total: total,
    details: details,
    submittedAt: new Date().toISOString()
  };
  // Gửi dạng form-urlencoded để Apps Script đọc bằng e.parameter.payload.
  // no-cors không cho đọc phản hồi; cần kiểm tra trang tính để xác nhận đã ghi.
  return fetch(SCORE_ENDPOINT, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" },
    body: new URLSearchParams({ payload: JSON.stringify(payload) }).toString(),
    keepalive: true
  });
}

function fig(q,n){return q.img!=null?`<figure><img src="${IMG[q.img]}" alt="Đồ thị của câu ${n+1}"></figure>`:""}
function build(){
  S={p1:shuffle(P1.map((_,i)=>i)).map(i=>({i,o:P1[i].fx?[0,1,2,3]:shuffle([0,1,2,3])})),p2:shuffle(P2.map((_,i)=>i))};
  warned=false;locked=false;
  const e=x=>x.replace(/&/g,"&amp;").replace(/</g,"&lt;");
  $("#top").innerHTML=`<h1>Kiểm tra Bài 8: Mô tả sóng</h1><p class="sub">Vật lí 11.</p><div class="who"><span>Họ và tên: <b>${e(who.name||"…………")}</b></span><span>Lớp: <b>${e(who.cls)}</b></span></div><div id="sum"></div>`;
  let h=`<section class="sheet"><h2>Phần I. Trắc nghiệm khách quan</h2><p class="sub">${N1} câu, 6,0 điểm</p><p class="hint">Mỗi câu chỉ chọn một phương án.</p>`;
  S.p1.forEach((b,n)=>{const q=P1[b.i];
    h+=`<div class="q" id="a1-${n}"><p class="qh"><span class="qn">Câu ${n+1}.</span> ${q.q}</p>${fig(q,n)}`+
    b.o.map((oi,k)=>`<label class="opt" data-o="${oi}"><input type="radio" name="a1_${n}" value="${oi}"><span class="l">${"ABCD"[k]}.</span><span class="t">${q.o[oi]}</span><span class="tag"></span></label>`).join("")+`<div class="why" hidden></div></div>`});
  h+=`</section><section class="sheet"><h2>Phần II. Trả lời ngắn</h2><p class="sub">${N2} câu, 4,0 điểm</p><p class="hint">Ghi đáp số, không cần trình bày lời giải. Có thể dùng dấu phẩy hoặc dấu chấm thập phân.</p>`;
  S.p2.forEach((qi,n)=>{const q=P2[qi];
    h+=`<div class="q" id="a2-${n}"><p class="qh"><span class="qn">Câu ${n+1}.</span> ${q.q}</p>${fig(q,n)}<div class="ans"><label for="i2_${n}">Đáp số:</label><input type="text" id="i2_${n}" inputmode="decimal" autocomplete="off"><span class="unit">${q.u}</span></div><div class="why" hidden></div></div>`});
  h+=`</section>`;
  $("#parts").innerHTML=h;$("#parts").classList.remove("locked");
  $("#subbar").hidden=false;$("#subbtn").hidden=false;$("#cnt").hidden=false;
  $("#prev").hidden=false;$("#next").hidden=false;$("#pal").hidden=false;
  {const m=$("#msg");if(m)m.remove()}
  QS=[...document.querySelectorAll("#parts .q")];R=[];mkPal();show(0);
  upd();
}
function answered(){
  let c=0;
  S.p1.forEach((_,n)=>{if($(`input[name=a1_${n}]:checked`))c++});
  S.p2.forEach((_,n)=>{if($(`#i2_${n}`).value.trim())c++});
  return c;
}
function upd(){$("#cnt").textContent=`Đã trả lời ${answered()}/${TOTAL} câu`;updPal()}
function stOf(i){
  if(locked)return R[i]||"none";
  const q=QS[i];
  if(i<N1)return q.querySelector("input:checked")?"done":"";
  return q.querySelector("input[type=text]").value.trim()?"done":"";
}
function mkPal(){
  const g=[["Phần I",0,N1],["Phần II",N1,N2]];
  $("#pal").innerHTML=g.map(([l,s,c])=>`<div class="pg"><span class="pl">${l}</span><span class="pb">${Array.from({length:c},(_,k)=>`<button type="button" class="pn" data-i="${s+k}" aria-label="${l}, câu ${k+1}">${k+1}</button>`).join("")}</span></div>`).join("");
}
function updPal(){
  document.querySelectorAll("#pal .pn").forEach(b=>{const i=+b.dataset.i;b.className="pn "+stOf(i)+(i===cur?" cur":"");if(i===cur)b.setAttribute("aria-current","true");else b.removeAttribute("aria-current")});
}
function show(i){
  cur=i;QS.forEach((q,j)=>q.hidden=j!==i);
  document.querySelectorAll("#parts .sheet").forEach(s=>s.hidden=!s.querySelector(".q:not([hidden])"));
  $("#prev").disabled=i===0;$("#next").disabled=i===QS.length-1;updPal();
}
function go(i){show(i);$("#parts").scrollIntoView()}
function mark(el,ok,txt){el.hidden=false;el.className="why "+(ok?"ok":"bad");el.innerHTML=txt}

function grade(){
  locked=true;let c1=0,c2=0;
  S.p1.forEach((b,n)=>{
    const q=P1[b.i],box=$("#a1-"+n),ch=box.querySelector("input:checked"),pick=ch?+ch.value:-1,ok=pick===q.a;
    if(ok)c1++;R[n]=ok?"ok":ch?"bad":"none";
    // Không hiển thị đáp án đúng, lựa chọn đúng/sai hoặc lời giải sau khi nộp.
    box.querySelectorAll(".opt").forEach(l=>l.classList.remove("ok","bad"));
    box.querySelectorAll(".tag").forEach(t=>t.textContent="");
    const why=box.querySelector(".why");if(why)why.hidden=true;
  });
  S.p2.forEach((qi,n)=>{
    const q=P2[qi],box=$("#a2-"+n),raw=$(`#i2_${n}`).value.trim(),v=parseFloat(raw.replace(",",".")),
      ok=!isNaN(v)&&Math.abs(v-q.a)<=q.t;
    if(ok)c2++;R[N1+n]=ok?"ok":raw?"bad":"none";
    const why=box.querySelector(".why");if(why)why.hidden=true;
  });
  document.querySelectorAll("#exam input").forEach(i=>i.disabled=true);
  $("#parts").classList.add("locked");
  const s1=c1*0.4,s2=c2*0.5,tot=Math.round((s1+s2)*100)/100;
  const details = `Phần I: ${c1}/${N1} câu đúng, ${fmt(s1)}/6 điểm; Phần II: ${c2}/${N2} câu đúng, ${fmt(s2)}/4 điểm`;
  sendScore(tot, 10, details).catch(err=>console.error("Không gửi được điểm:", err));
  $("#sum").innerHTML=`<div class="score"><span class="n">${fmt(tot)}</span><span class="d">/ 10 điểm</span></div>
  <table><tr><th>Phần</th><th>Kết quả</th><th>Điểm</th></tr>
  <tr><td>I. Trắc nghiệm khách quan</td><td>${c1}/${N1} câu đúng</td><td>${fmt(s1)}/6</td></tr>
  <tr><td>II. Trả lời ngắn</td><td>${c2}/${N2} câu đúng</td><td>${fmt(s2)}/4</td></tr></table>
  <p class="sub" style="margin-top:12px">Bài đã được nộp. Đáp án và lời giải không được hiển thị.</p>
  `;
  $("#subbtn").hidden=true;$("#cnt").hidden=true;{const m=$("#msg");if(m)m.remove()}
  // Sau khi nộp, ẩn toàn bộ đáp án/lời giải và không mở phần xem lại câu hỏi.
  document.querySelectorAll("#exam .why").forEach(el=>el.hidden=true);
  QS.forEach(q=>q.hidden=true);
  document.querySelectorAll("#parts .sheet").forEach(s=>s.hidden=true);
  $("#prev").hidden=true;$("#next").hidden=true;$("#pal").hidden=true;
  window.scrollTo(0,0);
}

$("#pal").addEventListener("click",ev=>{const b=ev.target.closest(".pn");if(b)go(+b.dataset.i)});
$("#prev").onclick=()=>go(cur-1);
$("#next").onclick=()=>go(cur+1);
$("#exam").addEventListener("keydown",ev=>{if(ev.key==="Enter"&&ev.target.type==="text"){ev.preventDefault();if(cur<QS.length-1)go(cur+1)}});
$("#gate").addEventListener("submit",ev=>{
  ev.preventDefault();
  const cls=$("#cls").value.trim();
  if(!cls){$("#gerr").textContent="Hãy nhập lớp của bạn trước khi bắt đầu.";$("#cls").focus();return}
  const nm=$("#nm").value.trim().replace(/\s+/g," ");
  if(nm.length<2){$("#gerr").textContent="Hãy nhập họ và tên của bạn trước khi bắt đầu.";$("#nm").focus();return}
  who={cls,name:nm};
  $("#gate").hidden=true;$("#exam").hidden=false;
  build();window.scrollTo(0,0);startTimer();
});
$("#exam").addEventListener("input",()=>{if(!locked){warned=false;upd();const m=$("#msg");if(m)m.remove()}});

// Đồng hồ đếm ngược 15 phút, hết giờ tự động nộp bài.
const LIMIT_MS=15*60*1000;let tmr=null;
function startTimer(){
  const el=$("#timer"),end=Date.now()+LIMIT_MS;el.hidden=false;
  const tick=()=>{
    if(locked){clearInterval(tmr);el.hidden=true;return}
    const left=Math.max(0,end-Date.now()),sec=Math.ceil(left/1000);
    el.textContent=String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0");
    el.classList.toggle("low",sec<=60);
    if(left<=0){clearInterval(tmr);warned=true;grade();el.hidden=true}
  };
  tick();tmr=setInterval(tick,250);
}
// Tự động nộp bài khi học sinh chuyển sang tab khác/ẩn trang.
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="hidden" && !$("#exam").hidden && !locked){
    warned=true;
    grade();
  }
});
$("#exam").addEventListener("submit",ev=>{
  ev.preventDefault();
  if(locked)return;
  const left=TOTAL-answered();
  if(left>0&&!warned){
    warned=true;
    let m=$("#msg");if(!m){m=document.createElement("p");m.id="msg";m.className="err";m.setAttribute("role","alert");$("#subbar").appendChild(m)}
    m.textContent=`Còn ${left} câu chưa trả lời. Nhấn “Nộp bài” lần nữa để nộp.`;
    return;
  }
  grade();
});
</script>
</body>
</html>
